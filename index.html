<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Librería JS</title>
    <script src="js/utileria.js"></script>
    <script src="js/validar.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="formulario">
        <h1>Registro de usuario</h1>
        <p>Formulario de prueba para librería</p>
        <form id="registro">

            <!-- Nombre -->
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Ej. Francisco González">

            <!-- Correo -->
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" placeholder="Ej. ejemplo@gmail.com">

            <!-- Fecha de nacimiento -->
            <label for="fechaNacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fechaNacimiento">

            <!-- Codigo Postal -->
            <label for="codigoPostal">Codigo Postal:</label>
            <input type="number" id="codigoPostal" placeholder="5 dígitos">

            <!-- Contraseña -->
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Ej. Hola123!">

            <!-- Validar Robot -->
            <label for="respuesta">Resuelve:   (34 + 33) =</label>
            <input type="number" id="respuesta" placeholder="Respuesta">

            <p id="mensaje"></p>
            <button type="submit" onclick="validarCampos()">Validar formulario</button>
        </form>
        <a href="login.html">Ir al inicio de sesión</a>
    </div>
    <!-- Modal -->
    <div id="modalEdad" class="modal">
        <div class="modal-contenido">
            <h2>Edad calculada</h2>
            <p id="resultadoEdad"></p>
            <img src="img/muchoTexto.png" alt="muchoText" width="250">
            <button id="aceptarModal">Aceptar</button>
        </div>
    </div>
</body>
</html>
