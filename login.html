<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="js/utileria.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <title>Login</title>
</head>
<body>
    <div class="formulario">
        <h1>Login</h1>
        <form id="registro">
            <!-- Correo -->
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" placeholder="Ej. ejemplo@gmail.com">

            <!-- Contraseña -->
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Ej. Hola123!">

            <p id="mensaje"></p>
            <button type="submit">Registrarme</button>
        </form>
        <a href="index.html">Ir a la validacion</a>
    </div>

    <div id="modalLogin" class="modal">
        <div class="modal-contenido">
            <p id="registrar"></p>
            <button id="aceptarModal">Aceptar</button>
        </div>
    </div>
    <script>
        const formulario = document.getElementById("registro");
        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            const correo = document.getElementById("correo").value.trim();
            const password = document.getElementById("password").value;
            // Validar correo
            if (!validarCorreo(correo)) {
                mensaje.textContent = "El correo electrónico no es válido.";
                return;
            }
            // Validar contraseña
            if (!validarPassword(password)) {
                mensaje.textContent =
                    "La contraseña debe tener mínimo 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.";
                return;
            }
            mensaje.textContent = "¡Todos los datos son válidos!";
            // Mostrar modal
            document.getElementById("registrar").textContent = "Registro exitoso";
            document.getElementById("modalLogin").style.display="flex";
        });
        // Cerrar modal con el botón Aceptar
        document.getElementById("aceptarModal").addEventListener("click", function() {
            document.getElementById("modalLogin").style.display = "none";
        });
    </script>
</body>
</html>
