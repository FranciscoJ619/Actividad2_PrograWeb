<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="js/utileria.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/validarLogin.js"></script>
    <title>Login</title>
</head>
<body>
    <div class="formulario">
        <h1>Login</h1>
        <form id="registro">
            <!-- Correo -->
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" placeholder="Ej. ejemplo@gmail.com">

            <!-- Contraseña -->
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Ej. Hola123!">

            <p id="mensaje"></p>
            <button type="submit" onclick="validarLogin()">Registrarme</button>
        </form>
        <a href="index.html">Ir a la validacion</a>
    </div>

    <div id="modalLogin" class="modal">
        <div class="modal-contenido">
            <p id="registrar"></p>
            <img src="img/bolaAmarilla.png" alt="validado" width="300">
            <button id="aceptarModal">Aceptar</button>
        </div>
    </div>
</body>
</html>
